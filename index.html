<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>☁️ Điện thoại Cloud</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        .phone {
            width: 380px;
            height: 750px;
            border-radius: 30px;
            overflow: hidden;
            border: 3px solid #00d4ff;
            box-shadow: 0 0 50px rgba(0, 200, 255, 0.3);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .status {
            color: #00ff88;
            font-size: 14px;
            font-family: Arial;
        }
        @media (max-width: 450px) {
            .phone {
                width: 320px;
                height: 630px;
            }
        }
    </style>
</head>
<body>
    <div class="status">📱 Đang tải Android...</div>
    <div class="phone">
        <iframe 
            src="https://appetize.io/embed/pixel4?device=pixel4&osVersion=11.0&scale=75&autoplay=true&orientation=portrait&screenOnly=true&xdoc=true"
            allow="accelerometer; autoplay; camera; encrypted-media; gyroscope; microphone"
            allowfullscreen>
        </iframe>
    </div>
    <div class="status">✅ Bấm vào màn hình để tương tác</div>
</body>
</html>
