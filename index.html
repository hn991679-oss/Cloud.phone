<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ Điện thoại Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .phone-wrapper {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 40px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.15);
        }
        .phone {
            width: 380px;
            height: 750px;
            border-radius: 30px;
            overflow: hidden;
            background: #000;
        }
        .phone iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 450px) {
            .phone { width: 320px; height: 630px; }
            .phone-wrapper { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="phone-wrapper">
        <div class="phone">
            <iframe src="https://appetize.io/embed/pixel4?device=pixel4&osVersion=11.0&scale=75&autoplay=true&orientation=portrait"></iframe>
        </div>
    </div>
</body>
</html>
